[package]
name = "bevy-jam-8"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
bevy_egui = { workspace = true, optional = true }
bevy-inspector-egui = { workspace = true, optional = true }
game = { path = "crates/game", version = "0.1.0" }

[features]
default = []
dev = [
  "game/dev",
  "dep:bevy_egui",
  "dep:bevy-inspector-egui",
  "bevy/file_watcher",
  "bevy/embedded_watcher",
]

[workspace]
members = ["crates/*", "systems/*"]

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false }
# currently must match the same version used by bevy_audio
# https://github.com/rust-lang/cargo/issues/14316
rodio = { version = "0.22.2", default-features = false }
bevy-inspector-egui = "0.38.0"
bevy_egui = "0.43.1"
fastrand = { version = "2.5.0", features = ["js"] }
ron = "0.12.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# must match the wasm-bindgen-cli version in the release workflow and README
wasm-bindgen = "=0.2.130"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
