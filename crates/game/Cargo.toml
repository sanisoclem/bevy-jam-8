[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true, features = [
  "3d",
  "ui",
  "tonemapping_luts",
  "zstd_rust",
] }
ron.workspace = true
serde.workspace = true

jam8 ={ path = "../jam8", version = "0.1.0" }

sys_anim = { path = "../../systems/anim", version = "0.1.0" }
